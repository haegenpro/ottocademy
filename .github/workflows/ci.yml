name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  # Throwaway secret used only inside CI - never a real production value.
  JWT_SECRET: 'ci-test-secret-do-not-use-in-prod'

jobs:
  lint:
    name: Lint & format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: ESLint
        run: npx eslint "{src,test}/**/*.ts" --max-warnings=0
      - name: Prettier format check
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Run unit tests
        run: npx jest --ci --coverage
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            reports/unit.xml
            coverage/
          retention-days: 7

  integration-test:
    name: Integration tests (real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: grocademy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d grocademy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: 'postgresql://test:test@localhost:5432/grocademy_test?schema=public'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Apply migrations (prisma migrate deploy)
        run: npx prisma migrate deploy
      - name: Run integration tests
        run: npx jest --ci --config ./test/jest-integration.json
      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: reports/integration.xml
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [lint, unit-test, integration-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Build
        run: npm run build

  security-audit:
    name: Dependency audit (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      # Non-blocking: surfaces advisories in the log/summary without
      # failing the pipeline on pre-existing transitive-dependency
      # advisories that would need breaking upgrades to clear. Keep this
      # visible rather than silent - see README for the current state.
      - name: npm audit (production dependencies)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ottocademy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
