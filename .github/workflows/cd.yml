name: CD

# Runs after CI has completed successfully on master, rather than
# duplicating CI's lint/test/build work here (workflow_run gives us the
# exact commit CI validated, via head_sha).
#
# Scope: GitHub Actions builds the production image and publishes it to
# GHCR. That is the final step of this pipeline - no hosting-platform
# deploy step runs here. GitLab is a downstream, read-only mirror for
# evaluator access only; it does not run CI/CD.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: cd-master
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & push image to GHCR
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          image="ghcr.io/${{ github.repository }}"
          sha="${{ github.event.workflow_run.head_sha }}"
          short_sha="${sha:0:7}"
          {
            echo "all<<EOF"
            echo "${image}:sha-${short_sha}"
            echo "${image}:master"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.all }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
