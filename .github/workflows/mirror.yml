name: Mirror to GitLab

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  mirror:
    name: Mirror GitHub repository to GitLab
    runs-on: ubuntu-latest

    steps:
      - name: Mirror repository
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git clone --mirror "https://github.com/${{ github.repository }}.git" repo
          cd repo
          git push --mirror "https://oauth2:${GITLAB_TOKEN}@gitlab.com/haegenquinston/Ottocademy.git"
